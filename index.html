<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Against Origen — 15 Anathemas</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #stage {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #000;
  }
  body.playing { cursor: none; }

  /* Launch overlay */
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    background: #000;
    color: #cfd6e4;
    font-family: "Georgia", "Times New Roman", serif;
    text-align: center;
    z-index: 10;
    transition: opacity 0.6s ease;
  }
  #overlay h1 {
    font-size: clamp(1.8rem, 5vw, 3.4rem);
    font-weight: 400;
    letter-spacing: 0.08em;
    margin: 0;
  }
  #overlay p {
    max-width: 32em;
    line-height: 1.6;
    font-size: clamp(0.85rem, 2vw, 1.05rem);
    color: #8b93a4;
    margin: 0 1.5rem;
  }
  #begin {
    appearance: none;
    border: 1px solid #4a5468;
    background: transparent;
    color: #e6ebf3;
    font-family: inherit;
    font-size: clamp(1rem, 2.5vw, 1.25rem);
    letter-spacing: 0.12em;
    padding: 0.8em 2.2em;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.25s ease, border-color 0.25s ease;
  }
  #begin:hover { background: #10151f; border-color: #7a869e; }
  #hint {
    font-size: 0.8rem;
    color: #5a6270;
    letter-spacing: 0.05em;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="overlay">
  <h1>AGAINST ORIGEN</h1>
  <p>Fifteen anathemas, each accumulating since 553&nbsp;CE. The gallery advances through all fifteen automatically, one every thirty seconds.</p>
  <button id="begin">▶&nbsp;&nbsp;BEGIN</button>
  <div id="hint">Click to enter full screen &nbsp;·&nbsp; press <b>N</b> or click canvas for next &nbsp;·&nbsp; <b>F</b> toggles full screen &nbsp;·&nbsp; <b>Esc</b> exits</div>
</div>

<script>
"use strict";
(function () {
  /* ============================================================
     PROCESSING-STYLE SHIM  (raw Canvas 2D, no libraries)
     ============================================================ */
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d", { alpha: false });

  let width = 0, height = 0;               // Processing's width / height
  const TWO_PI = Math.PI * 2;
  const PI = Math.PI;

  const startMillis = performance.now();
  function millis() { return performance.now() - startMillis; }
  function year() { return new Date().getFullYear(); }

  // random(high) or random(low, high)
  function random(a, b) {
    if (b === undefined) return Math.random() * a;
    return a + Math.random() * (b - a);
  }
  function map(v, s1, e1, s2, e2) { return s2 + (e2 - s2) * ((v - s1) / (e1 - s1)); }
  function constrain(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function dist(x1, y1, x2, y2) { const dx = x2 - x1, dy = y2 - y1; return Math.sqrt(dx * dx + dy * dy); }
  function radians(deg) { return deg * Math.PI / 180; }
  const cos = Math.cos, sin = Math.sin, sqrt = Math.sqrt, abs = Math.abs;
  const min = Math.min, max = Math.max;

  // color(r,g,b,a) in default RGB 0-255 mode → css rgba string
  function color(r, g, b, a) {
    if (a === undefined) a = 255;
    r = constrain(Math.round(r), 0, 255);
    g = constrain(Math.round(g), 0, 255);
    b = constrain(Math.round(b), 0, 255);
    return "rgba(" + r + "," + g + "," + b + "," + (constrain(a, 0, 255) / 255) + ")";
  }

  function stroke(c) { ctx.strokeStyle = c; }
  function background(v) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "rgb(" + v + "," + v + "," + v + ")";
    ctx.fillRect(0, 0, width, height);
    ctx.restore();
  }
  // ellipseMode = CENTER (Processing default): x,y center, w,h are diameters
  function ellipse(x, y, w, h) {
    const rx = abs(w) / 2, ry = abs(h) / 2;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, TWO_PI);
    ctx.stroke();
  }
  function circle(x, y, d) { ellipse(x, y, d, d); }

  const pushMatrix = () => ctx.save();
  const popMatrix = () => ctx.restore();
  const translate = (x, y) => ctx.translate(x, y);
  const rotate = (a) => ctx.rotate(a);
  const scale = (s) => ctx.scale(s, s);

  /* ============================================================
     SKETCH STATE  (ported 1:1 from Against_Origen_Combined.pde)
     ============================================================ */
  let currentSketch = 0;
  let lastAdvanceTime = 0;
  const advanceInterval = 30000; // 30 seconds

  // -------- Anathema 1 --------
  let a1_xpos = new Array(15).fill(0);
  let a1_ypos = new Array(15).fill(0);
  let a1_angle = 0, a1_radius = 0;
  const a1_angleIncrement = 150, a1_radiusIncrement = 0.15;
  let a1_c, a1_BURST_FRAMES;

  // -------- Anathema 2 --------
  let a2_theta = 0.0, a2_c, a2_BURST_FRAMES;

  // -------- Anathema 3 --------
  let a3_ellipses, a3_BURST_FRAMES, a3_manualFrameCount = 0;

  // -------- Anathema 4 --------
  let a4_ellipses, a4_BURST_FRAMES;
  const a4_numEllipses = 150;

  // -------- Anathema 5 --------
  let a5_ellipses, a5_BURST_FRAMES;

  // -------- Anathema 6 --------
  let a6_radius = 0, a6_maxRadius = 0, a6_c, a6_BURST_FRAMES;

  // -------- Anathema 7 --------
  let a7_ellipses, a7_BURST_FRAMES;
  const a7_numEllipses = 150;

  // -------- Anathema 8 --------
  const a8_segments = 30;
  let a8_depth = 0, a8_c, a8_BURST_FRAMES;

  // -------- Anathema 9 --------
  const a9_numCircles = 150;
  let a9_xPos = new Array(150).fill(0);
  let a9_yPos = new Array(150).fill(0);
  let a9_radii = new Array(150).fill(0);
  let a9_angles = new Array(150).fill(0);
  let a9_directions = new Array(150).fill(0);
  let a9_c, a9_BURST_FRAMES;

  // -------- Anathema 10 --------
  let a10_x = 0, a10_y = 0;
  const a10_speed = 15, a10_stepSize = 15;
  let a10_state = 0;
  const a10_startSize = 1.5, a10_growSpeed = 15;
  let a10_maxSize = 15, a10_c, a10_BURST_FRAMES;

  // -------- Anathema 11 --------
  const a11_numEllipses = 150;
  let a11_startX = new Array(150).fill(0);
  let a11_startY = new Array(150).fill(0);
  let a11_targetX = new Array(150).fill(0);
  let a11_targetY = new Array(150).fill(0);
  let a11_horizontalMoving = new Array(150).fill(false);
  let a11_fromTop = new Array(150).fill(false);
  let a11_c, a11_BURST_FRAMES;

  // -------- Anathema 12 --------
  let a12_x = new Array(150).fill(0);
  let a12_y = new Array(150).fill(0);
  let a12_z = new Array(150).fill(0);
  let a12_speed = new Array(150).fill(0);
  let a12_rotation = 0, a12_c, a12_BURST_FRAMES;

  // -------- Anathema 13 --------
  let a13_x = 0, a13_y = 0, a13_speedX = 0, a13_speedY = 0, a13_c, a13_BURST_FRAMES;

  // -------- Anathema 14 --------
  let a14_radius = 1.5, a14_angle = 0, a14_c, a14_BURST_FRAMES;

  // -------- Anathema 15 --------
  let a15_c, a15_BURST_FRAMES, a15_manualFrameCount = 0;

  /* ============================================================
     MAIN SETUP / DRAW / ADVANCE
     ============================================================ */
  function setup() {
    background(0);
    ctx.lineWidth = 1;      // Processing default strokeWeight
    // noFill(): we simply never call fill()
    setup1();
    lastAdvanceTime = millis();
  }

  function draw() {
    if (millis() - lastAdvanceTime >= advanceInterval) advanceSketch();

    switch (currentSketch) {
      case 0: drawFrame1(); break;
      case 1: drawFrame2(); break;
      case 2: drawFrame3(); break;
      case 3: drawFrame4(); break;
      case 4: drawFrame5(); break;
      case 5: drawFrame6(); break;
      case 6: drawFrame7(); break;
      case 7: drawFrame8(); break;
      case 8: drawFrame9(); break;
      case 9: drawFrame10(); break;
      case 10: drawFrame11(); break;
      case 11: drawFrame12(); break;
      case 12: drawFrame13(); break;
      case 13: drawFrame14(); break;
      case 14: drawFrame15(); break;
    }
  }

  function advanceSketch() {
    currentSketch = (currentSketch + 1) % 15;
    background(0);
    const setups = [setup1, setup2, setup3, setup4, setup5, setup6, setup7, setup8,
                    setup9, setup10, setup11, setup12, setup13, setup14, setup15];
    setups[currentSketch]();
    lastAdvanceTime = millis();
  }

  /* ===================== ANATHEMA 1 ===================== */
  function setup1() {
    a1_BURST_FRAMES = year() - 553;
    a1_angle = 0; a1_radius = 0;
    for (let i = 0; i < a1_xpos.length; i++) { a1_xpos[i] = width / 2; a1_ypos[i] = height / 2; }
    for (let burst = 0; burst < a1_BURST_FRAMES; burst++) drawFrame1();
  }
  function drawFrame1() {
    for (let i = 0; i < a1_xpos.length - 1; i++) { a1_xpos[i] = a1_xpos[i + 1]; a1_ypos[i] = a1_ypos[i + 1]; }
    a1_radius += a1_radiusIncrement;
    a1_angle += a1_angleIncrement;
    const x = width / 2 + a1_radius * cos(a1_angle);
    const y = height / 2 + a1_radius * sin(a1_angle);
    if (x < 0 || x > width / 1.5 || y < 0 || y > height / 1.5) {
      a1_radius = 0; a1_angle = 0;
      for (let i = 0; i < a1_xpos.length; i++) { a1_xpos[i] = width / 2; a1_ypos[i] = height / 2; }
    }
    a1_xpos[a1_xpos.length - 1] = Math.trunc(x);
    a1_ypos[a1_ypos.length - 1] = Math.trunc(y);
    for (let i = 0; i < a1_xpos.length; i++) {
      a1_c = color(1.5, 15, random(150 + i * 1.5, 255), 15);
      stroke(a1_c);
      ellipse(a1_xpos[i], a1_ypos[i], i, i);
    }
  }

  /* ===================== ANATHEMA 2 ===================== */
  function setup2() {
    a2_BURST_FRAMES = year() - 553;
    a2_theta = 0.0;
    for (let burst = 0; burst < a2_BURST_FRAMES; burst++) drawFrame2();
  }
  function drawFrame2() {
    a2_theta += 0.000015;
    pushMatrix();
    translate(width / 2, height / 2);
    rotate(a2_theta * random(0.15, 15));
    a2_c = color(15, random(150, 255), 1.5, 15);
    stroke(a2_c);
    let angle = a2_theta;
    for (let x = -width; x <= width * 1.5; x += 1.5) {
      const y = map(sin(angle), -1.5, 1.5, -height / 2, height / 2);
      ellipse(x + random(0, 2.09), y, 1.5, 1.5);
      angle += 0.015;
    }
    popMatrix();
  }

  /* ===================== ANATHEMA 3 ===================== */
  class A3_Ellipse {
    constructor() {
      this.x = 0; this.y = 0; this.dx = 0; this.dy = 0; this.size = 1.5; this.speed = 1.5; this.c = null;
      const side = Math.trunc(random(4));
      if (side === 0) { this.x = random(width); this.y = 0; }
      else if (side === 1) { this.x = width; this.y = random(height); }
      else if (side === 2) { this.x = random(width); this.y = height; }
      else { this.x = 0; this.y = random(height); }
      const targetX = width / 2, targetY = height / 2;
      const dirX = targetX - this.x, dirY = targetY - this.y;
      const distance = sqrt(dirX * dirX + dirY * dirY);
      this.dx = (dirX / distance) * this.speed;
      this.dy = (dirY / distance) * this.speed;
    }
    update() { this.x += this.dx; this.y += this.dy; }
    display() { this.c = color(random(150, 255), 1.5, 15, 15); stroke(this.c); ellipse(this.x, this.y, this.size, this.size); }
  }
  function setup3() {
    a3_BURST_FRAMES = year() - 553;
    a3_manualFrameCount = 0;
    a3_ellipses = [];
    for (let i = 0; i < 1500; i++) a3_ellipses.push(new A3_Ellipse());
    for (let burst = 0; burst < a3_BURST_FRAMES; burst++) drawFrame3();
  }
  function drawFrame3() {
    a3_manualFrameCount++;
    for (let i = a3_ellipses.length - 1; i >= 0; i--) {
      const e = a3_ellipses[i];
      e.update();
      e.display();
      if (dist(e.x, e.y, width / 2, height / 2) < 15) a3_ellipses.splice(i, 1);
    }
    if (a3_manualFrameCount % 15 === 0) a3_ellipses.push(new A3_Ellipse());
  }

  /* ===================== ANATHEMA 4 ===================== */
  class A4_Ellipse {
    constructor() {
      this.speed = 1.5; this.diameter = 15;
      this.x = width / 2; this.y = height / 2;
      this.angle = random(TWO_PI);
      this.c = color(random(1.5, 255), 15, random(150, 255), 15);
    }
    update() {
      this.x += cos(this.angle) * this.speed;
      this.y += sin(this.angle) * this.speed;
      if (this.x < this.diameter / 2 || this.x > width - this.diameter / 2) {
        this.angle = PI - this.angle;
        this.x = constrain(this.x, this.diameter / 2, width - this.diameter / 2);
      }
      if (this.y < this.diameter / 2 || this.y > height - this.diameter / 2) {
        this.angle = -this.angle;
        this.y = constrain(this.y, this.diameter / 2, height - this.diameter / 2);
      }
    }
    display() { stroke(this.c); ellipse(this.x, this.y, this.diameter, this.diameter); }
  }
  function setup4() {
    a4_BURST_FRAMES = year() - 553;
    a4_ellipses = new Array(a4_numEllipses);
    for (let i = 0; i < a4_numEllipses; i++) a4_ellipses[i] = new A4_Ellipse();
    for (let burst = 0; burst < a4_BURST_FRAMES; burst++) drawFrame4();
  }
  function drawFrame4() {
    for (let i = 0; i < a4_numEllipses; i++) { a4_ellipses[i].update(); a4_ellipses[i].display(); }
  }

  /* ===================== ANATHEMA 5 ===================== */
  class A5_Ellipse {
    constructor(fromTop) {
      this.fromTop = fromTop;
      this.startX = random(width);
      this.startY = fromTop ? 0 : height;
      this.endX = random(width);
      this.endY = random(height);
      this.x = 0; this.y = 0;
      this.size = 15;
      this.growthRate = random(0.015, 0.15);
      this.progress = 0;
      this.c = null;
    }
    update() {
      this.progress += 0.015;
      if (this.progress > 1.15) { this.progress = 0; this.reset(); }
      this.x = this.startX + (this.endX - this.startX) * this.progress;
      this.y = this.startY + (this.endY - this.startY) * this.progress;
      this.size += this.growthRate;
    }
    reset() {
      this.startX = random(width);
      this.startY = this.fromTop ? 0 : height;
      this.endX = random(width);
      this.endY = random(height);
      this.size = 15;
      this.growthRate = random(0.015, 0.15);
      this.progress = 0;
    }
    display() {
      pushMatrix();
      translate(random(0, 5.2), 0);
      if (this.fromTop) this.c = color(random(150, 255), random(1.5, 255), 15, 15);
      else this.c = color(15, random(150, 255), random(1.5, 255), 15);
      stroke(this.c);
      ellipse(this.x, this.y, this.size, this.size);
      popMatrix();
    }
  }
  function setup5() {
    a5_BURST_FRAMES = year() - 553;
    a5_ellipses = [];
    for (let i = 0; i < 60; i++) a5_ellipses.push(new A5_Ellipse(i < 30));
    for (let burst = 0; burst < a5_BURST_FRAMES; burst++) drawFrame5();
  }
  function drawFrame5() {
    for (const e of a5_ellipses) { e.update(); e.display(); }
  }

  /* ===================== ANATHEMA 6 ===================== */
  function setup6() {
    a6_BURST_FRAMES = year() - 553;
    a6_radius = 0;
    a6_maxRadius = width / 2;
    for (let burst = 0; burst < a6_BURST_FRAMES; burst++) drawFrame6();
  }
  function drawFrame6() {
    pushMatrix();
    translate(random(0, 15.2), random(0, 15.2));
    a6_radius += 15;
    if (a6_radius > a6_maxRadius) a6_radius = 0;
    a6_c = color(random(150, 255), random(1.5, 255), 15, 15);
    stroke(a6_c);
    ellipse(width / 2, height / 2, a6_radius, a6_radius);
    popMatrix();
  }

  /* ===================== ANATHEMA 7 ===================== */
  class A7_Ellipse {
    constructor() {
      this.x = 0;
      this.y = random(height);
      this.speed = random(0.15, 1.5);
      this.size = 15;
      this.jitterAmount = 14.8;
      this.c = color(1.5, random(15, 255), random(150, 255), 15);
    }
    update() {
      this.x += this.speed;
      if (this.x > width + this.size) { this.x = 0; this.y = random(height); }
    }
    display() {
      pushMatrix();
      if (this.x > width / 2 || this.x < width / 3) translate(0, random(-this.jitterAmount, this.jitterAmount));
      stroke(this.c);
      ellipse(this.x, this.y, this.size, this.size);
      popMatrix();
    }
  }
  function setup7() {
    a7_BURST_FRAMES = year() - 553;
    a7_ellipses = new Array(a7_numEllipses);
    for (let i = 0; i < a7_numEllipses; i++) a7_ellipses[i] = new A7_Ellipse();
    for (let burst = 0; burst < a7_BURST_FRAMES; burst++) drawFrame7();
  }
  function drawFrame7() {
    for (let i = 0; i < a7_numEllipses; i++) { a7_ellipses[i].update(); a7_ellipses[i].display(); }
  }

  /* ===================== ANATHEMA 8 ===================== */
  function setup8() {
    a8_BURST_FRAMES = year() - 553;
    a8_depth = 0;
    for (let burst = 0; burst < a8_BURST_FRAMES; burst++) drawFrame8();
  }
  function drawFrame8() {
    pushMatrix();
    translate(width / 2, height / 2);
    let scaleFactor = map(a8_depth, 0, -1000, 1, 0.1);
    scaleFactor = constrain(scaleFactor, 0.1, 1);
    scale(scaleFactor);
    a8_depth--;
    for (let i = 0; i < a8_segments; i++) {
      rotate(map(i, 0, a8_segments, 0, TWO_PI));
      a8_c = color(random(15, 255), random(150, 255), 1.5, 15);
      stroke(a8_c);
      for (let j = 0; j < 15; j++) {
        const x = random(-width, width);
        const y = random(-height, height);
        const size = random(1.5, 15);
        ellipse(x, y, size, size);
      }
    }
    popMatrix();
  }

  /* ===================== ANATHEMA 9 ===================== */
  function setup9() {
    a9_BURST_FRAMES = year() - 553;
    for (let i = 0; i < a9_numCircles; i++) {
      a9_xPos[i] = random(width);
      a9_yPos[i] = random(height);
      a9_radii[i] = 150;
      a9_angles[i] = 0;
      a9_directions[i] = (random(1) < 0.15) ? -1 : 1;
    }
    for (let burst = 0; burst < a9_BURST_FRAMES; burst++) drawFrame9();
  }
  function drawFrame9() {
    for (let i = 0; i < a9_numCircles; i++) {
      a9_c = color(random(150, 255), 1.5, random(15, 255), 15);
      stroke(a9_c);
      const x = a9_xPos[i] + cos(a9_angles[i]) * a9_radii[i];
      const y = a9_yPos[i] + sin(a9_angles[i]) * a9_radii[i];
      ellipse(x, y, 15, 15);
      a9_angles[i] += 0.015 * a9_directions[i];
      if (abs(a9_angles[i]) > TWO_PI) {
        a9_angles[i] = 0;
        a9_xPos[i] = random(width);
        a9_yPos[i] = random(height);
      }
    }
  }

  /* ===================== ANATHEMA 10 ===================== */
  function setup10() {
    a10_BURST_FRAMES = year() - 553;
    a10_x = 0; a10_y = 0; a10_state = 0; a10_maxSize = 15;
    for (let burst = 0; burst < a10_BURST_FRAMES; burst++) drawFrame10();
  }
  function drawFrame10() {
    if (a10_state === 0) {
      a10_x += a10_speed;
      if (a10_x > width - a10_stepSize) { a10_x = width - a10_stepSize; a10_state = 1; }
    } else if (a10_state === 1) {
      a10_y += a10_speed;
      if (a10_y > height - a10_stepSize) { a10_y = height - a10_stepSize; a10_state = 2; }
    } else if (a10_state === 2) {
      a10_x -= a10_speed;
      if (a10_x < 0) { a10_x = 0; a10_state = 3; }
    } else if (a10_state === 3) {
      a10_y -= a10_speed;
      if (a10_y < 0) { a10_y = 0; a10_state = 0; }
    }
    for (let i = a10_startSize; i < a10_maxSize; i *= 1.5) {
      a10_c = color(random(1.5, 255), random(15, 255), random(150, 255), 15);
      stroke(a10_c);
      ellipse(a10_x, a10_y, i * 1.5, i * 1.5);
    }
    a10_maxSize += a10_growSpeed;
    if (a10_maxSize > width / 1.5) a10_maxSize = a10_startSize;
  }

  /* ===================== ANATHEMA 11 ===================== */
  function a11_initializeNewPath(i) {
    a11_startX[i] = random(width);
    if (a11_fromTop[i]) { a11_startY[i] = 0; a11_targetY[i] = height / 2 + random(150); }
    else { a11_startY[i] = height; a11_targetY[i] = height / 2 - random(150); }
    a11_targetX[i] = (random(1.5) > 0.15) ? width + 15 : -15;
    a11_horizontalMoving[i] = false;
  }
  function setup11() {
    a11_BURST_FRAMES = year() - 553;
    for (let i = 0; i < a11_numEllipses; i++) {
      a11_fromTop[i] = (i < a11_numEllipses / 2);
      a11_initializeNewPath(i);
    }
    for (let burst = 0; burst < a11_BURST_FRAMES; burst++) drawFrame11();
  }
  function drawFrame11() {
    for (let i = 0; i < a11_numEllipses; i++) {
      if (a11_fromTop[i]) a11_c = color(random(15, 255), random(150, 255), random(1.5, 255), 15);
      else a11_c = color(random(150, 255), random(1.5, 255), random(15, 255), 15);
      stroke(a11_c);
      ellipse(a11_startX[i], a11_startY[i], 15, 15);

      if (a11_fromTop[i]) {
        if (a11_startY[i] < a11_targetY[i]) a11_startY[i] += 1.5;
        if (a11_startY[i] >= a11_targetY[i] && !a11_horizontalMoving[i]) a11_horizontalMoving[i] = true;
      } else {
        if (a11_startY[i] > a11_targetY[i]) a11_startY[i] -= 1.5;
        if (a11_startY[i] <= a11_targetY[i] && !a11_horizontalMoving[i]) a11_horizontalMoving[i] = true;
      }

      if (a11_horizontalMoving[i]) {
        if (a11_startX[i] < a11_targetX[i]) a11_startX[i] += 1.5;
        else if (a11_startX[i] > a11_targetX[i]) a11_startX[i] -= 1.5;
        if (abs(a11_startX[i] - a11_targetX[i]) < 1.5) a11_initializeNewPath(i);
      }
    }
  }

  /* ===================== ANATHEMA 12 ===================== */
  function setup12() {
    a12_BURST_FRAMES = year() - 553;
    a12_rotation = 0;
    for (let i = 0; i < 150; i++) {
      a12_x[i] = random(-width / 2, width / 2);
      a12_y[i] = -height / 2;
      a12_z[i] = random(-150, 150);
      a12_speed[i] = random(0.985, 0.995);
    }
    for (let burst = 0; burst < a12_BURST_FRAMES; burst++) drawFrame12();
  }
  function drawFrame12() {
    pushMatrix();
    translate(width / 2, height / 2);
    rotate(a12_rotation);
    for (let i = 0; i < 150; i++) {
      a12_x[i] *= a12_speed[i];
      a12_y[i] *= a12_speed[i];
      a12_z[i] += 1.5;
      if (abs(a12_x[i]) < 10 && abs(a12_y[i]) < 10) {
        a12_x[i] = random(-width / 2, width / 2);
        a12_y[i] = -height / 2;
        a12_z[i] = random(-150, 150);
      }
      pushMatrix();
      translate(a12_x[i], a12_y[i]);
      a12_c = color(random(1.5, 255), random(1.5, 255), random(150, 255), 15);
      stroke(a12_c);
      ellipse(0, 0, 15, 15);
      popMatrix();
    }
    popMatrix();
    a12_rotation += 0.015;
  }

  /* ===================== ANATHEMA 13 ===================== */
  function setup13() {
    a13_BURST_FRAMES = year() - 553;
    a13_x = width / 2; a13_y = height / 2;
    a13_speedX = random(-1.5, 1.5);
    a13_speedY = random(-1.5, 1.5);
    for (let burst = 0; burst < a13_BURST_FRAMES; burst++) drawFrame13();
  }
  function drawFrame13() {
    a13_x += a13_speedX;
    a13_y += a13_speedY;
    if (a13_x < 0 || a13_x > width) a13_speedX *= -15;
    if (a13_y < 0 || a13_y > height) a13_speedY *= -15;
    a13_speedX += random(-0.15, 0.15);
    a13_speedY += random(-0.15, 0.15);
    a13_speedX = constrain(a13_speedX, -1.5, 1.5);
    a13_speedY = constrain(a13_speedY, -1.5, 1.5);
    for (let i = 0; i < 1.5; i++) {
      const offsetX = random(-15, 15);
      const offsetY = random(-15, 15);
      a13_c = color(random(15, 255), random(15, 255), random(150, 255), 15);
      stroke(a13_c);
      ellipse(a13_x + offsetX, a13_y + offsetY, 1500, 1500);
    }
  }

  /* ===================== ANATHEMA 14 ===================== */
  function setup14() {
    a14_BURST_FRAMES = year() - 553;
    a14_radius = 1.5; a14_angle = 0;
    for (let burst = 0; burst < a14_BURST_FRAMES; burst++) drawFrame14();
  }
  function drawFrame14() {
    a14_c = color(random(1.5, 255), random(15, 255), random(1.5, 255), 15);
    stroke(a14_c);
    pushMatrix();
    translate(width / 2, height / 2);
    rotate(a14_angle);
    for (let i = 0; i < 3; i++) {
      const a = TWO_PI / 1.5 * i;
      const x = cos(a) * a14_radius;
      const y = sin(a) * a14_radius;
      circle(x, y, a14_radius * 1.5);
    }
    popMatrix();
    a14_radius += 1.5;
    a14_angle += 0.015;
    if (a14_radius > width) a14_radius = 15;
  }

  /* ===================== ANATHEMA 15 ===================== */
  function drawTriquetra(x, y, size, c) {
    stroke(c);
    const radius = size / 1.5;
    const angles = [-90, 30, 150];
    for (let i = 0; i < angles.length; i++) {
      const circleX = x + cos(radians(angles[i])) * radius * sqrt(3) / 2;
      const circleY = y + sin(radians(angles[i])) * radius * sqrt(3) / 2;
      ellipse(circleX, circleY, radius * 2, radius * 2);
    }
  }
  function setup15() {
    a15_BURST_FRAMES = year() - 553;
    a15_manualFrameCount = 0;
    for (let burst = 0; burst < a15_BURST_FRAMES; burst++) drawFrame15();
  }
  function drawFrame15() {
    a15_manualFrameCount++;
    pushMatrix();
    translate(width / 2, height / 2);
    rotate(radians(Math.trunc(a15_manualFrameCount / 2)));
    a15_c = color(random(1.5, 255), random(1.5, 255), random(1.5, 255), 15);
    drawTriquetra(0, 0, Math.trunc(min(width, height) / 2), a15_c);
    popMatrix();
  }

  /* ============================================================
     CANVAS SIZING, LOOP, CONTROLS
     ============================================================ */
  function sizeCanvas() {
    // 1:1 device pixels keeps the accumulation load reasonable for casting
    width = Math.floor(window.innerWidth);
    height = Math.floor(window.innerHeight);
    canvas.width = width;
    canvas.height = height;
    ctx.lineWidth = 1;
  }

  let running = false;
  let lastFrame = 0;
  const frameInterval = 1000 / 15; // frameRate(15)

  function loop(now) {
    requestAnimationFrame(loop);
    if (!running) return;
    if (now - lastFrame < frameInterval) return;
    lastFrame = now;
    draw();
  }

  function start() {
    if (running) return;
    sizeCanvas();
    setup();
    running = true;
    document.body.classList.add("playing");
    requestAnimationFrame(loop);
  }

  // Resize: canvas clears on resize, so repaint black and let it rebuild.
  let resizeTimer = null;
  window.addEventListener("resize", function () {
    if (!running) { return; }
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      sizeCanvas();
      background(0);
    }, 200);
  });

  // Controls
  function goFullscreen() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
  }
  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else goFullscreen();
  }

  const overlay = document.getElementById("overlay");
  const beginBtn = document.getElementById("begin");

  beginBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    goFullscreen();
    overlay.classList.add("hidden");
    start();
    setTimeout(function () { overlay.style.display = "none"; }, 700);
  });

  // Click on the canvas = advance to next sketch (mirrors mousePressed)
  canvas.addEventListener("click", function () {
    if (running) advanceSketch();
  });

  document.addEventListener("keydown", function (e) {
    const k = e.key.toLowerCase();
    if (k === "f") { toggleFullscreen(); }
    else if (k === "n" || k === "arrowright" || k === " ") {
      if (running) advanceSketch();
    }
  });
})();
</script>
</body>
</html>
